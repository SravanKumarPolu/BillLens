# Maestro release flow: guest-account-upgrade
# Phase 8 Prompt 80 — required release flow.
# Verifies: guest account upgrade preserves all local data.
# Run: maestro test e2e/maestro/phase8/guest-account-upgrade.yaml

appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    text: "BillLens"
    timeout: 10000
# Sign in from guest state (upgrade path)
- tapOn:
    text: "Settings"
    timeout: 5000
- tapOn:
    text: "Sign in"
    timeout: 5000
- inputText: "tester+upgrade@billlens.test"
- tapOn:
    text: "Send code"
    timeout: 5000
- inputText: "123456"
- tapOn:
    text: "Verify"
    timeout: 5000
# Local groups must still be visible after upgrade
- tapOn:
    text: "Groups"
    timeout: 5000
- assertVisible:
    text: "Upgrade Trip"
    timeout: 10000
# NOTE: structural flow — final device validation happens during
# closed beta on physical devices (see docs/release/test-summary.md).
